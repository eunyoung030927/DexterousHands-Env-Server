# MAPPO config file for basic MLP policy 
env_name: mappo
algorithm_name: mappo
experiment_name: check
run_dir: ./logs
use_centralized_V: True
use_obs_instead_of_state: False
num_env_steps: 100000000 # max_iterations * num_envs * episode_length 
episode_length: 125 # shadow_hand_bottle_cap env episode length
n_rollout_threads: 256 # numEnvs 
n_eval_rollout_threads: 1
use_linear_lr_decay: False # linear learning rate decay
hidden_size: 1024 # because of OOM 
use_render: False
recurrent_N: 1 # ignored for MLP policy
use_single_network: False

save_interval: 1
use_eval: False
eval_interval: 25
log_interval: 25
eval_episodes: 10000

gamma: 0.99 # long-terrm horizon reward 
gae_lambda: 0.95
use_gae: True
use_popart: True
use_valuenorm: False
use_proper_time_limits: False

kl_threshold: 0.016
ls_step: 10
accept_ratio: 0.5
clip_param: 0.2
ppo_epoch: 5 # change to 4 from 5 to reduce overfitting 
num_mini_batch: 64 # num of mini-batch to split each
data_chunk_length: 10 # ignored for MLP policy
value_loss_coef: 1
entropy_coef: 0.005 # agent to explore more 
max_grad_norm: 10
huber_delta: 10.0
use_recurrent_policy: False # use MLP policy instead of RNN policy
use_naive_recurrent_policy: False
use_max_grad_norm: True
use_clipped_value_loss: True
use_huber_loss: True
use_value_active_masks: False
use_policy_active_masks: False

lr: 3.e-4
critic_lr: 3.e-4
opti_eps: 1.e-5
weight_decay: 0.0

gain: 0.01
actor_gain: 0.01
use_orthogonal: True

use_feature_normalization: True
use_ReLU: True
stacked_frames: 4 # number of stacked frames for each observation # for RNN style 
layer_N: 3 # number of hidden layers for each actor and critic network 

std_x_coef: 1
std_y_coef: 0.5